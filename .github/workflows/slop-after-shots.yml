# Temporary workflow, on the branch only. It builds the site, serves dist/ statically and
# captures the after screenshots for the anti-slop PR with Playwright Chromium: light and
# dark, 1440 px and 390 px, first screen and full page, plus one viewport shot at the Flow
# section to pair with the audit's flow-step3 before shot. It uploads a landing-zoom-after
# artifact. It never deploys anywhere: the Pages deploy on main is untouched.
name: slop after shots

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slop-after-shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build (including the prerender)
        run: |
          npm ci
          npm run build

      - name: Serve dist statically
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              echo "preview is up"
              exit 0
            fi
            sleep 1
          done
          echo "preview never came up"
          cat preview.log
          exit 1

      - name: Install Playwright Chromium
        run: |
          npm i playwright --no-save
          npx playwright install --with-deps chromium

      - name: Capture the after shots
        run: node scripts/zoom-after-shots.mjs
        env:
          BASE_URL: http://127.0.0.1:4173

      - uses: actions/upload-artifact@v4
        with:
          name: landing-zoom-after
          path: shots/*.png
          if-no-files-found: error
