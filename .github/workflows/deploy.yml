name: Build and Deploy Landing

# Same hosting as the documentation: built here, served by GitHub Pages on a custom domain
# (public/CNAME), with Cloudflare in front of it for DNS.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build landing page
        run: npm run build

      # The single-page fallback GitHub Pages serves for any unknown path is written by
      # scripts/prerender.mjs, at the end of `npm run build`: dist/index.html now carries the page
      # already rendered, which belongs to "/" alone, so 404.html keeps the plain shell and a
      # noindex directive rather than being a copy of it.

      # my.invoicerr.app is a Cloudflare Worker, not a GitHub Pages path: GitHub Pages serves static
      # files only and the waiting list form has to POST somewhere. The Worker serves the six
      # prerendered dist/waitlist/<lang>/ pages of the build that just ran, so it is deployed from
      # here, out of the same dist/, rather than from a workflow of its own that would build again
      # and could drift.
      - name: Deploy the waiting list Worker
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The Resend key is a Worker secret, pushed on every deploy so that rotating the
          # repository secret is all it takes. Worker secrets survive a deploy, so this is an update
          # rather than a first write after the first run.
          secrets: |
            RESEND_API_KEY
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
