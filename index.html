  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0a1215" media="(prefers-color-scheme: dark)" />
    <title>Invoicerr — Open-source invoicing software, self-hosted or cloud</title>
    <meta
      name="description"
      content="Quotes, invoices, payments and e-invoicing to the tax office in one open-source app. Self-host it free with Docker, or start a 14-day cloud trial."
    />
    <link rel="canonical" href="https://invoicerr.app/" />
    <!-- max-image-preview:large is what lets a screenshot run full width in a search result. -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

      property="og:description"

    />

    <meta name="twitter:title" content="Invoicerr - The invoicing app that keeps up with you" />
    <meta
      name="twitter:description"
      content="Quotes, invoices, payments and e-invoicing to the tax office in one open-source app. Cloud or self-hosted."
    />
    <meta name="twitter:image" content="https://invoicerr.app/og.jpg" />
    <meta name="twitter:image:alt" content="Invoicerr: open-source invoicing, in the cloud or on your own server." />
    <!--
      Structured data. Every statement here is readable somewhere on the page: the prices come from
      src/lib/pricing.ts, the questions and answers are the ones the FAQ section renders word for
      word, and the feature list only names things the sections below actually show. No rating, no
      review, no customer count — none of those exist, and declaring one is a manual action waiting
      to happen.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://invoicerr.app/#organization",
            "name": "Invoicerr",
            "url": "https://invoicerr.app/",
            "logo": "https://invoicerr.app/apple-touch-icon.png",
            "description": "Invoicerr is an open-source invoicing application, released under AGPL-3.0, that can be self-hosted or used as a hosted service.",
            "sameAs": ["https://github.com/invoicerr-app/invoicerr"]
          },
          {
            "@type": "WebSite",
            "@id": "https://invoicerr.app/#website",
            "url": "https://invoicerr.app/",
            "name": "Invoicerr",
            "description": "Open-source invoicing, in the cloud or on your own server.",
            "inLanguage": "en",
            "publisher": { "@id": "https://invoicerr.app/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://invoicerr.app/#software",
            "name": "Invoicerr",
            "url": "https://invoicerr.app/",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "Invoicing software",
            "operatingSystem": "Web browser; Docker on Linux (amd64, arm64, arm/v7)",
            "description": "Quotes, invoices, payments and e-invoicing to the tax office in one open-source app. Self-host it with Docker, or use the hosted version.",
            "inLanguage": "en",
            "license": "https://www.gnu.org/licenses/agpl-3.0.html",
            "downloadUrl": "https://github.com/invoicerr-app/invoicerr",
            "installUrl": "https://docs.invoicerr.app/docs/user-guide/docker-installation",
            "softwareHelp": "https://docs.invoicerr.app/",
            "publisher": { "@id": "https://invoicerr.app/#organization" },
            "featureList": [
              "Quotes signed online with a one-time code, deposits and instalments",
              "Invoices, credit notes, purchase orders and expenses in one document engine",
              "Bank statement import and reconciliation by reference and amount",
              "A client portal with documents, balance, PDFs and online payment",
              "Self-hosted OCR that reads received supplier invoices",
              "E-invoice formats: Factur-X, XRechnung, FatturaPA and FA(3)",
              "Transmission to national platforms: PDP, Chorus Pro, KSeF and SdI",
              "A hashed legal archive kept for the retention period of the seller's country",
              "Time tracking that turns unbilled hours into invoice lines",
              "A REST API, an MCP server and 18 webhook events, scoped by API key",
              "18 interface languages, a document language per recipient, multi-currency"
            ],
            "offers": [
              {
                "@type": "Offer",
                "name": "Self-hosted",
                "price": "0",
                "priceCurrency": "USD",
                "url": "https://invoicerr.app/#pricing",
                "description": "Run it on your own server under AGPL-3.0. Every feature, unlimited seats and companies."
              },
              {
                "@type": "Offer",
                "name": "Cloud",
                "price": "15",
                "priceCurrency": "USD",
                "url": "https://invoicerr.app/#pricing",
                "description": "Per company, per month, in USD. The first seat is $15, seats 2 to 4 are $4 each and every seat after that is $3. Paying yearly costs ten months instead of twelve. A 14-day trial comes first."
              }
            ]
          },
          {
            "@type": "FAQPage",
            "@id": "https://invoicerr.app/#faq",
            "inLanguage": "en",
            "isPartOf": { "@id": "https://invoicerr.app/#website" },
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Is the self-hosted version really free?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. It is the same app with every feature and no seat limit, released under the AGPL-3.0 license — which also covers running it as a paid service for other people, as long as you offer your own users the corresponding source."
                }
              },
              {
                "@type": "Question",
                "name": "What can I do during the cloud trial?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Everything except sending documents. For 14 days you can set up your company, import clients, build quotes and invoices and invite your team. Sending unlocks when you subscribe."
                }
              },
              {
                "@type": "Question",
                "name": "How does seat pricing work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "You pay per company. The first seat is $15 a month, seats 2 to 4 are $4 each, and every seat after that is $3. Paying yearly costs ten months instead of twelve."
                }
              },
              {
                "@type": "Question",
                "name": "What happens to my data if I stop paying?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "The company becomes read-only for 14 days. After that, the owner receives a zip with a PDF and a JSON export of every document before anything is deleted."
                }
              },
              {
                "@type": "Question",
                "name": "Which countries are supported?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Germany, France, Italy, Poland and Portugal ship with their rules filled in: identifiers, VAT rates, e-invoice formats, transmission channels and archive retention. The country support matrix shows exactly what each one covers."
                }
              },
              {
                "@type": "Question",
                "name": "What do I need to self-host it?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Docker, PostgreSQL and Redis — the app won't boot without all three. The compose file in the install guide starts Postgres alongside it; add a Redis service and point REDIS_URL at it. For larger setups there is a Helm chart."
                }
              }
            ]
          }
        ]
      }
    </script>
    <!--
      Sets the theme class before first paint: the visitor's stored choice, else the OS scheme. The
      `js` class on the same element arms the scroll-reveal styles in src/index.css — without it the
      page renders fully visible, which is what a reader with JavaScript off gets.
    -->
    <script>
      (function () {
        document.documentElement.classList.add('js');
        var stored = null;
        try { stored = localStorage.getItem('invoicerr-theme'); } catch (e) {}
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
