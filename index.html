<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)" href="/favicon-32-dark.png" />
    <link rel="icon" type="image/png" sizes="16x16" media="(prefers-color-scheme: dark)" href="/favicon-16-dark.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Same values as --background in src/index.css (identity "Lagune"), light then dark. -->
    <meta name="theme-color" content="#f3f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1215" media="(prefers-color-scheme: dark)" />
    <title>Invoicerr - Open-source invoicing, in the cloud or on your server</title>
    <meta
      name="description"
      content="Quotes, invoices, payments and e-invoicing to the tax office in one open-source app. Start a 14-day cloud trial or host it yourself for free."
    />
    <link rel="canonical" href="https://invoicerr.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://invoicerr.app/" />
    <meta property="og:title" content="Invoicerr - The invoicing app that keeps up with you" />
    <meta
      property="og:description"
      content="Quotes, invoices, payments and e-invoicing to the tax office in one open-source app. Cloud or self-hosted."
    />
    <meta property="og:image" content="https://invoicerr.app/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Sets the theme class before first paint: the visitor's stored choice, else the OS scheme. -->
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('invoicerr-theme'); } catch (e) {}
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
